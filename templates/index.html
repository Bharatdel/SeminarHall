<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Seminar Hall Booking Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='college_logo.png') }}" alt="College Logo" class="h-8 w-8 object-contain">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Seminar Hall Booking Portal</h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">College Event Reservation System</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    Immediate Booking
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Controls Dashboard -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- View Selector (Daily / Weekly) -->
            <div class="flex bg-slate-100 p-1 rounded-lg w-full md:w-auto">
                <button id="btn-day-view" class="flex-1 md:flex-none px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-white text-indigo-600 shadow-sm" onclick="setView('day')">
                    <i class="fa-solid fa-calendar-day mr-2"></i>Daily View
                </button>
                <button id="btn-week-view" class="flex-1 md:flex-none px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200 text-slate-600 hover:text-slate-900" onclick="setView('week')">
                    <i class="fa-solid fa-calendar-week mr-2"></i>Weekly View
                </button>
            </div>

            <!-- Date / Week Navigation -->
            <div class="flex items-center justify-between gap-3 w-full md:w-auto">
                <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-lg transition-colors border border-slate-200" onclick="navigateDate(-1)" title="Previous">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                
                <div class="flex items-center gap-2">
                    <input type="date" id="date-picker" class="border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white shadow-sm" onchange="onDateChanged(this.value)">
                    <button class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-lg transition-colors border border-indigo-200" onclick="setToday()">
                        Today
                    </button>
                </div>

                <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-lg transition-colors border border-slate-200" onclick="navigateDate(1)" title="Next">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Date Range Indicator Label -->
            <div id="view-label" class="text-base font-bold text-slate-800 text-center md:text-right w-full md:w-auto">
                Loading...
            </div>
        </div>

        <!-- Parallel Windows Layout (Side-by-Side) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            
            <!-- LEFT WINDOW: Available Slots -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col lg:h-[600px] h-auto">
                <div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
                        <h2 class="text-lg font-bold text-slate-900">Available Slots</h2>
                    </div>
                    <span class="text-xs text-slate-500 font-medium">Select hours to request booking</span>
                </div>
                
                <!-- Scrollable slots/grid container -->
                <div id="available-container" class="p-5 overflow-y-auto flex-1">
                    <!-- Dynamic rendering -->
                </div>

                <!-- Footer Action Area - Sticky & Shadowed for Mobile -->
                <div id="available-footer" class="border-t border-slate-200 p-4 bg-white/95 backdrop-blur-sm flex items-center justify-between sticky bottom-0 z-10 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] hidden">
                    <span id="selected-count" class="text-sm font-semibold text-slate-600">0 slots selected</span>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-md shadow-indigo-100 transition-all duration-200 active:scale-[0.98]" onclick="openBookingModalForSelected()">
                        Book Selected Slots
                    </button>
                </div>
            </div>

            <!-- RIGHT WINDOW: Booked Slots -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col lg:h-[600px] h-auto">
                <div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-lock text-rose-500 text-lg"></i>
                        <h2 class="text-lg font-bold text-slate-900">Booked Slots & Details</h2>
                    </div>
                    <span class="text-xs text-slate-500 font-medium">Already reserved schedule</span>
                </div>

                <!-- Scrollable details list container -->
                <div id="booked-container" class="p-5 overflow-y-auto flex-1 bg-slate-50/50">
                    <!-- Dynamic rendering -->
                </div>
            </div>

        </div>

    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeBookingModal()"></div>
        <!-- Dialog -->
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-lg w-full m-4 overflow-hidden relative z-10 animate-[fadeIn_0.2s_ease-out]">
            <div class="bg-indigo-600 text-white px-6 py-4 flex items-center justify-between">
                <h3 class="text-lg font-bold">Request Seminar Hall Booking</h3>
                <button class="text-white/80 hover:text-white transition-colors" onclick="closeBookingModal()">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="p-6 space-y-4">
                <!-- Selected Details summary banner -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-3.5 flex flex-col gap-1 text-indigo-900">
                    <div class="text-sm font-semibold">
                        <i class="fa-solid fa-calendar mr-2 text-indigo-500"></i>Date: <span id="modal-summary-date" class="font-normal text-slate-700"></span>
                    </div>
                    <div class="text-sm font-semibold">
                        <i class="fa-solid fa-clock mr-2 text-indigo-500"></i>Time: <span id="modal-summary-time" class="font-normal text-slate-700"></span>
                    </div>
                </div>

                <!-- Faculty Name -->
                <div>
                    <label for="faculty_name" class="block text-sm font-semibold text-slate-700 mb-1">Faculty Name <span class="text-rose-500">*</span></label>
                    <input type="text" id="faculty_name" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm" placeholder="e.g. Dr. Jane Smith">
                </div>

                <!-- Department -->
                <div>
                     <label for="department" class="block text-sm font-semibold text-slate-700 mb-1">Department <span class="text-rose-500">*</span></label>
                     <select id="department" required onchange="toggleCustomDeptInput(this.value)" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm bg-white">
                         <option value="">-- Select Department --</option>
                         <option value="Hindi">Hindi</option>
                         <option value="English">English</option>
                         <option value="Math">Math</option>
                         <option value="Geography">Geography</option>
                         <option value="History">History</option>
                         <option value="Political Science">Political Science</option>
                         <option value="Physical Education">Physical Education</option>
                         <option value="Sanskrit">Sanskrit</option>
                         <option value="Economics">Economics</option>
                         <option value="Physics">Physics</option>
                         <option value="Chemistry">Chemistry</option>
                         <option value="Computer Science">Computer Science</option>
                         <option value="Music (V)">Music (V)</option>
                         <option value="Music(I)">Music(I)</option>
                         <option value="Home Science &amp; Fashion Designing">Home Science &amp; Fashion Designing</option>
                         <option value="Commerce &amp; Mgmt.">Commerce &amp; Mgmt.</option>
                         <option value="NCC">NCC</option>
                         <option value="NSS">NSS</option>
                         <option value="Women Cell">Women Cell</option>
                         <option value="Legal Literacy Cell">Legal Literacy Cell</option>
                         <option value="Literary Club">Literary Club</option>
                         <option value="Road Safety">Road Safety</option>
                         <option value="Other">Other (Specify Below)</option>
                     </select>
                    <input type="text" id="custom-department" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm mt-2 hidden" placeholder="Enter department name">
                </div>

                <!-- Phone Number -->
                <div>
                    <label for="phone" class="block text-sm font-semibold text-slate-700 mb-1">Phone Number <span class="text-rose-500">*</span></label>
                    <input type="tel" id="phone" required pattern="[0-9\-+\s]{10,15}" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm" placeholder="e.g. 9876543210">
                    <p class="text-xs text-slate-400 mt-1">Please enter a valid 10-15 digit phone number</p>
                </div>

                <!-- Purpose -->
                <div>
                    <label for="purpose" class="block text-sm font-semibold text-slate-700 mb-1">Purpose of Booking <span class="text-rose-500">*</span></label>
                    <textarea id="purpose" required rows="3" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm" placeholder="e.g. Guest seminar on Quantum Computing, Hackathon opening, etc."></textarea>
                </div>

                <!-- Hidden inputs for time range -->
                <input type="hidden" id="modal-date">
                <input type="hidden" id="modal-start-hour">
                <input type="hidden" id="modal-end-hour">

                <!-- Action buttons -->
                <div class="flex gap-3 justify-end pt-4 border-t border-slate-100">
                    <button type="button" class="px-4 py-2 border border-slate-300 text-slate-700 text-sm font-semibold rounded-lg hover:bg-slate-50 transition-colors shadow-sm" onclick="closeBookingModal()">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors shadow-md shadow-indigo-100">
                        Confirm & Book
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // State
        let currentView = 'day'; // 'day' or 'week'
        let selectedDate = new Date().toISOString().split('T')[0];
        let bookings = [];
        let selectedDaySlots = []; // Array of slot indices in day view

        // Predefined 1-hour slots
        const SLOTS = [
            { start: 9, end: 10, label: '09:00 AM - 10:00 AM' },
            { start: 10, end: 11, label: '10:00 AM - 11:00 AM' },
            { start: 11, end: 12, label: '11:00 AM - 12:00 PM' },
            { start: 12, end: 13, label: '12:00 PM - 01:00 PM' },
            { start: 13, end: 14, label: '01:00 PM - 02:00 PM' },
            { start: 14, end: 15, label: '02:00 PM - 03:00 PM' },
            { start: 15, end: 16, label: '03:00 PM - 04:00 PM' }
        ];

        // Format dates in long format
        const dateFormatter = new Intl.DateTimeFormat('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        const weekDayFormatter = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        // On document load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date-picker').value = selectedDate;
            fetchBookings();
        });

        // Toggle Views
        function setView(view) {
            currentView = view;
            
            const btnDay = document.getElementById('btn-day-view');
            const btnWeek = document.getElementById('btn-week-view');
            
            if (view === 'day') {
                btnDay.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                btnDay.classList.remove('text-slate-600', 'hover:text-slate-900');
                btnWeek.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                btnWeek.classList.add('text-slate-600', 'hover:text-slate-900');
            } else {
                btnWeek.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                btnWeek.classList.remove('text-slate-600', 'hover:text-slate-900');
                btnDay.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                btnDay.classList.add('text-slate-600', 'hover:text-slate-900');
            }
            
            selectedDaySlots = [];
            document.getElementById('available-footer').classList.add('hidden');
            
            fetchBookings();
        }

        // Handle Datepicker change
        function onDateChanged(val) {
            if (!val) return;
            selectedDate = val;
            selectedDaySlots = [];
            document.getElementById('available-footer').classList.add('hidden');
            fetchBookings();
        }

        // Set to today
        function setToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date-picker').value = today;
            onDateChanged(today);
        }

        // Day/Week navigation (-1 for prev, +1 for next)
        function navigateDate(offset) {
            const date = new Date(selectedDate);
            if (currentView === 'day') {
                date.setDate(date.getDate() + offset);
            } else {
                date.setDate(date.getDate() + (offset * 7));
            }
            const newDateStr = date.toISOString().split('T')[0];
            document.getElementById('date-picker').value = newDateStr;
            onDateChanged(newDateStr);
        }

        // Fetch bookings from Flask API based on date range
        function fetchBookings() {
            let start, end;
            const targetDate = new Date(selectedDate);

            if (currentView === 'day') {
                start = selectedDate;
                end = selectedDate;
                document.getElementById('view-label').innerText = dateFormatter.format(targetDate);
            } else {
                // Calculate week range (Mon to Sun)
                const day = targetDate.getDay();
                const diff = targetDate.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(targetDate.setDate(diff));
                
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                
                start = monday.toISOString().split('T')[0];
                end = sunday.toISOString().split('T')[0];
                
                document.getElementById('view-label').innerText = `${weekDayFormatter.format(monday)} - ${weekDayFormatter.format(sunday)}`;
            }

            fetch(`/api/bookings?start_date=${start}&end_date=${end}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        bookings = data.bookings;
                        renderViews();
                    } else {
                        alert('Failed to load bookings: ' + data.message);
                    }
                })
                .catch(err => {
                    console.error('Error fetching bookings:', err);
                    alert('Error reaching server. Check backend.');
                });
        }

        // Get department background badge classes
        function getDeptBadgeClass(dept) {
            switch (dept) {
                case 'Computer Science':
                    return 'bg-amber-100 text-amber-800 border border-amber-200';
                case 'Electrical Engineering':
                    return 'bg-blue-100 text-blue-800 border border-blue-200';
                case 'Mechanical Engineering':
                    return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
                case 'Civil Engineering':
                    return 'bg-teal-100 text-teal-800 border border-teal-200';
                case 'Chemical Engineering':
                    return 'bg-cyan-100 text-cyan-800 border border-cyan-200';
                case 'Physics':
                case 'Chemistry':
                case 'Mathematics':
                    return 'bg-purple-100 text-purple-800 border border-purple-200';
                case 'Business Administration':
                    return 'bg-pink-100 text-pink-800 border border-pink-200';
                default:
                    return 'bg-slate-100 text-slate-800 border border-slate-200';
            }
        }

        // Determine if a slot overlaps with any booking
        function getOverlapBooking(date, startHour, endHour) {
            return bookings.find(b => 
                b.booking_date === date && 
                b.start_hour < endHour && 
                b.end_hour > startHour
            );
        }

        // Render views based on currentView state
        function renderViews() {
            if (currentView === 'day') {
                renderDailyView();
            } else {
                renderWeeklyView();
            }
        }

        // RENDER DAILY VIEW
        function renderDailyView() {
            const availContainer = document.getElementById('available-container');
            const bookedContainer = document.getElementById('booked-container');
            
            // Render Available Slots (Left Window)
            const anyChecked = selectedDaySlots.length > 0;
            let availHtml = '<div class="space-y-3 pb-2">';
            SLOTS.forEach((slot, index) => {
                const booking = getOverlapBooking(selectedDate, slot.start, slot.end);
                if (booking) {
                    // Slot is booked - Light Red theme
                    availHtml += `
                        <div class="flex items-center justify-between p-4 bg-rose-50 border border-rose-100 rounded-xl opacity-90 text-rose-950 select-none">
                            <div class="flex items-center gap-3">
                                <span class="h-4 w-4 rounded bg-rose-200 flex items-center justify-center">
                                    <i class="fa-solid fa-lock text-[10px] text-rose-600"></i>
                                </span>
                                <div>
                                    <span class="text-sm font-semibold text-rose-900">${slot.label}</span>
                                    <span class="ml-2.5 inline-block text-[11px] font-bold text-rose-700 bg-rose-100/50 border border-rose-200/50 px-1.5 py-0.5 rounded">Booked</span>
                                </div>
                            </div>
                            <span class="text-xs text-rose-700 font-medium italic" title="Booked on ${formatTimestamp(booking.created_at)}">${booking.department} (${formatTimestampShort(booking.created_at)})</span>
                        </div>
                    `;
                } else {
                    // Slot is available - Light Green theme
                    const isChecked = selectedDaySlots.includes(index);
                    // Hide Quick Book button if any checkbox is checked to avoid user confusion
                    const actionButton = anyChecked ? '' : `
                        <button class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-500 shadow-sm shadow-emerald-100 transition-colors" onclick="event.stopPropagation(); openBookingModal('${selectedDate}', [{start_hour: ${slot.start}, end_hour: ${slot.end}}])">
                            Quick Book
                        </button>
                    `;
                    availHtml += `
                        <div class="flex items-center justify-between p-4 ${isChecked ? 'bg-emerald-100 border-emerald-500 ring-1 ring-emerald-500 text-emerald-950 font-medium' : 'bg-emerald-50/40 border-emerald-100 hover:bg-emerald-100/70 hover:border-emerald-200 text-emerald-900'} rounded-xl transition-all duration-200 cursor-pointer" onclick="toggleSlotSelection(${index})">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} class="h-4.5 w-4.5 rounded border-emerald-300 text-emerald-600 focus:ring-indigo-500 bg-white" onclick="event.stopPropagation(); toggleSlotSelection(${index})">
                                <span class="text-sm font-semibold">${slot.label}</span>
                            </div>
                            ${actionButton}
                        </div>
                    `;
                }
            });
            availHtml += '</div>';
            availContainer.innerHTML = availHtml;

            // Render Booked Slots (Right Window)
            const dayBookings = bookings.filter(b => b.booking_date === selectedDate);
            if (dayBookings.length === 0) {
                bookedContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-16 text-center text-slate-400">
                        <i class="fa-solid fa-calendar-check text-4xl mb-3 text-slate-300 animate-pulse"></i>
                        <p class="font-semibold text-slate-500 text-sm">No reservations for today</p>
                        <p class="text-xs text-slate-400 max-w-xs mt-1">Select and book slots from the available list on the left.</p>
                    </div>
                `;
            } else {
                let bookedHtml = '<div class="space-y-4">';
                dayBookings.forEach(b => {
                    const timeLabel = `${formatHour24(b.start_hour)} - ${formatHour24(b.end_hour)}`;
                    bookedHtml += `
                        <div class="bg-rose-50/20 p-5 border border-rose-100 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
                                <span class="text-sm font-bold text-rose-700 bg-rose-100/60 px-2.5 py-1 rounded-lg border border-rose-200/50">
                                    <i class="fa-regular fa-clock mr-1.5"></i>${timeLabel}
                                </span>
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${getDeptBadgeClass(b.department)}">
                                    ${b.department}
                                </span>
                            </div>
                            <div class="space-y-2 text-sm">
                                <div>
                                    <span class="text-rose-900/60 font-semibold uppercase text-[10px] tracking-wider block mb-0.5">Faculty In-Charge</span>
                                    <span class="text-slate-800 font-bold text-base"><i class="fa-regular fa-user mr-2 text-rose-500"></i>${b.faculty_name}</span>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 border-t border-rose-100/50 mt-2">
                                    <div>
                                        <span class="text-rose-900/60 font-semibold uppercase text-[10px] tracking-wider block mb-0.5">Phone Number</span>
                                        <span class="text-slate-700 font-medium"><i class="fa-solid fa-phone mr-1.5 text-slate-400"></i>${b.phone}</span>
                                    </div>
                                    <div>
                                        <span class="text-rose-900/60 font-semibold uppercase text-[10px] tracking-wider block mb-0.5">Event Purpose</span>
                                        <span class="text-slate-700 font-medium" title="${b.purpose}">
                                            <i class="fa-solid fa-circle-info mr-1.5 text-slate-400"></i>${b.purpose.length > 30 ? b.purpose.substring(0, 30) + '...' : b.purpose}
                                        </span>
                                    </div>
                                </div>
                                <div class="pt-1.5 border-t border-rose-100/30 mt-2 text-xs flex justify-between items-center text-rose-900/50">
                                    <span class="font-medium uppercase text-[9px] tracking-wider">Booked On</span>
                                    <span class="font-medium text-[10.5px]"><i class="fa-regular fa-calendar-check mr-1.5"></i>${formatTimestamp(b.created_at)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                bookedHtml += '</div>';
                bookedContainer.innerHTML = bookedHtml;
            }
        }

        // RENDER WEEKLY VIEW
        function renderWeeklyView() {
            const availContainer = document.getElementById('available-container');
            const bookedContainer = document.getElementById('booked-container');
            
            // Calculate week dates (Mon to Sun)
            const targetDate = new Date(selectedDate);
            const day = targetDate.getDay();
            const diff = targetDate.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(targetDate.setDate(diff));
            
            const weekDates = [];
            const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d.toISOString().split('T')[0]);
            }

            // Render Available Slots Table Grid (Left Window)
            let availHtml = `
                <div class="overflow-x-auto border border-slate-200 rounded-lg">
                    <table class="w-full text-left border-collapse bg-white">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200">
                                <th class="p-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-r border-slate-200">Slot</th>
            `;
            
            weekDates.forEach((date, i) => {
                const dayLabel = weekDays[i].substring(0, 3); // Mon, Tue, etc.
                const formattedDay = date.split('-')[2] + '/' + date.split('-')[1]; // DD/MM
                availHtml += `
                    <th class="p-3 text-center border-r border-slate-200 min-w-[80px]">
                        <div class="text-xs font-bold text-slate-800">${dayLabel}</div>
                        <div class="text-[10px] text-slate-400 font-medium">${formattedDay}</div>
                    </th>
                `;
            });
            availHtml += '</tr></thead><tbody>';

            SLOTS.forEach(slot => {
                availHtml += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50/20">
                        <td class="p-2.5 text-[11px] font-bold text-slate-600 bg-slate-50/50 border-r border-slate-200">
                            ${slot.label.replace(' AM', '').replace(' PM', '')}
                        </td>
                `;
                
                weekDates.forEach(date => {
                    const booking = getOverlapBooking(date, slot.start, slot.end);
                    if (booking) {
                        // Cell is Booked - Light Red theme
                        availHtml += `
                            <td class="p-1 border-r border-slate-200 bg-rose-50 text-center select-none" title="Booked by ${booking.faculty_name} (${booking.department}) on ${formatTimestamp(booking.created_at)}: ${booking.purpose}">
                                <div class="text-[9px] font-bold text-rose-700 bg-rose-100 border border-rose-200 px-1 py-0.5 rounded leading-tight">
                                    ${booking.department.substring(0, 7)}...
                                </div>
                            </td>
                        `;
                    } else {
                        // Cell is Free - Light Green theme
                        availHtml += `
                            <td class="p-1 border-r border-slate-200 text-center bg-emerald-50/20">
                                <button class="w-full h-8 flex items-center justify-center bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded border border-emerald-100/50 transition-colors" onclick="openBookingModal('${date}', [{start_hour: ${slot.start}, end_hour: ${slot.end}}])" title="Book this slot">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </td>
                        `;
                    }
                });
                availHtml += '</tr>';
            });
            availHtml += '</tbody></table></div>';
            availContainer.innerHTML = availHtml;

            // Render Booked Slots List (Right Window)
            // Gather and sort bookings in the week range
            const weekBookings = bookings.filter(b => weekDates.includes(b.booking_date));
            
            if (weekBookings.length === 0) {
                bookedContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-16 text-center text-slate-400">
                        <i class="fa-solid fa-calendar-check text-4xl mb-3 text-slate-300 animate-pulse"></i>
                        <p class="font-semibold text-slate-500 text-sm">No reservations for this week</p>
                        <p class="text-xs text-slate-400 max-w-xs mt-1">Click the '+' button in any calendar slot to reserve it.</p>
                    </div>
                `;
            } else {
                // Group bookings by date
                const grouped = {};
                weekDates.forEach(d => grouped[d] = []);
                weekBookings.forEach(b => {
                    if (grouped[b.booking_date]) {
                        grouped[b.booking_date].push(b);
                    }
                });

                let bookedHtml = '<div class="space-y-5">';
                weekDates.forEach((date, i) => {
                    const list = grouped[date];
                    if (list.length === 0) return;
                    
                    const dt = new Date(date);
                    const formattedDate = dateFormatter.format(dt);
                    
                    bookedHtml += `
                        <div class="border-l-4 border-rose-500 pl-3">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">${formattedDate}</h3>
                            <div class="space-y-3">
                    `;
                    
                    list.forEach(b => {
                        const timeLabel = `${formatHour24(b.start_hour)} - ${formatHour24(b.end_hour)}`;
                        bookedHtml += `
                            <div class="bg-rose-50/20 p-4 border border-rose-100 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200">
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                    <span class="text-xs font-bold text-rose-700 bg-rose-100 px-2 py-0.5 rounded border border-rose-200">
                                        ${timeLabel}
                                    </span>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${getDeptBadgeClass(b.department)}">
                                        ${b.department}
                                    </span>
                                </div>
                                <div class="text-xs">
                                    <div class="font-bold text-slate-800 mb-1"><i class="fa-regular fa-user mr-1.5 text-rose-500"></i>${b.faculty_name}</div>
                                    <div class="text-slate-600 line-clamp-1"><i class="fa-solid fa-circle-info mr-1 text-slate-400"></i>Purpose: ${b.purpose}</div>
                                    <div class="text-slate-500 mt-1"><i class="fa-solid fa-phone mr-1 text-slate-400"></i>Contact: ${b.phone}</div>
                                    <div class="text-rose-900/50 mt-1 text-[10px] border-t border-rose-100/30 pt-1"><i class="fa-regular fa-calendar-check mr-1 text-rose-400"></i>Booked on: ${formatTimestamp(b.created_at)}</div>
                                </div>
                            </div>
                        `;
                    });
                    
                    bookedHtml += '</div></div>';
                });
                bookedHtml += '</div>';
                bookedContainer.innerHTML = bookedHtml;
            }
        }

        // Global to hold selected ranges for the active modal
        let modalRanges = [];

        // Group selected index numbers into consecutive range blocks
        function getRangesFromIndices(indices) {
            if (indices.length === 0) return [];
            
            // Assumes indices is sorted ascending
            const ranges = [];
            let startIdx = indices[0];
            let prevIdx = indices[0];
            
            for (let i = 1; i < indices.length; i++) {
                if (indices[i] === prevIdx + 1) {
                    prevIdx = indices[i];
                } else {
                    ranges.push({
                        start_hour: SLOTS[startIdx].start,
                        end_hour: SLOTS[prevIdx].end
                    });
                    startIdx = indices[i];
                    prevIdx = indices[i];
                }
            }
            ranges.push({
                start_hour: SLOTS[startIdx].start,
                end_hour: SLOTS[prevIdx].end
            });
            return ranges;
        }

        // Toggle selected slot indices in Daily View
        function toggleSlotSelection(index) {
            const pos = selectedDaySlots.indexOf(index);
            if (pos > -1) {
                selectedDaySlots.splice(pos, 1);
            } else {
                selectedDaySlots.push(index);
            }
            
            // Sort selected slots
            selectedDaySlots.sort((a, b) => a - b);
            
            const footer = document.getElementById('available-footer');
            const countText = document.getElementById('selected-count');
            
            if (selectedDaySlots.length > 0) {
                footer.classList.remove('hidden');
                countText.innerHTML = `<span class="text-emerald-700 font-bold"><i class="fa-solid fa-square-check mr-1.5"></i>${selectedDaySlots.length}</span> slot(s) selected`;
            } else {
                footer.classList.add('hidden');
            }
            
            renderDailyView();
        }

        // Open Booking Modal for checkbox selection in Daily View
        function openBookingModalForSelected() {
            if (selectedDaySlots.length === 0) return;
            const ranges = getRangesFromIndices(selectedDaySlots);
            openBookingModal(selectedDate, ranges);
        }

        // Open Booking Modal and initialize selected ranges
        function openBookingModal(date, ranges) {
            const modal = document.getElementById('booking-modal');
            modalRanges = ranges;
            
            document.getElementById('modal-date').value = date;
            
            const formattedDt = dateFormatter.format(new Date(date));
            document.getElementById('modal-summary-date').innerText = formattedDt;
            
            // Format multiple times separated by commas
            const formattedTimes = ranges.map(r => `${formatHour24(r.start_hour)} to ${formatHour24(r.end_hour)}`).join(', ');
            document.getElementById('modal-summary-time').innerText = formattedTimes;
            
            // Show modal
            modal.classList.remove('hidden');
            document.getElementById('faculty_name').focus();
        }

        // Close Booking Modal
        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
            document.getElementById('booking-form').reset();
            document.getElementById('custom-department').classList.add('hidden');
            document.getElementById('custom-department').removeAttribute('required');
            modalRanges = [];
        }

        // Handle Other Department selection
        function toggleCustomDeptInput(val) {
            const customInput = document.getElementById('custom-department');
            if (val === 'Other') {
                customInput.classList.remove('hidden');
                customInput.setAttribute('required', 'true');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.removeAttribute('required');
            }
        }

        // Handle Booking Submit
        function handleBookingSubmit(event) {
            event.preventDefault();
            
            const faculty_name = document.getElementById('faculty_name').value.trim();
            const selectedDept = document.getElementById('department').value;
            const customDept = document.getElementById('custom-department').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const purpose = document.getElementById('purpose').value.trim();
            const booking_date = document.getElementById('modal-date').value;
            
            const department = selectedDept === 'Other' ? customDept : selectedDept;

            if (!faculty_name || !department || !phone || !purpose) {
                alert('Please fill out all fields.');
                return;
            }

            if (modalRanges.length === 0) {
                alert('No booking slots selected.');
                return;
            }

            const payload = {
                faculty_name,
                department,
                phone,
                purpose,
                booking_date,
                ranges: modalRanges
            };

            fetch('/api/bookings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(res => {
                if (res.status === 201) {
                    alert('Booking Confirmed Successfully!');
                    closeBookingModal();
                    
                    // Clear selected indicators
                    selectedDaySlots = [];
                    document.getElementById('available-footer').classList.add('hidden');
                    
                    fetchBookings();
                } else {
                    alert('Booking failed: ' + res.body.message);
                }
            })
            .catch(err => {
                console.error('Error submitting booking:', err);
                alert('Connection error occurred while saving reservation.');
            });
        }

        // Helper: Format hour integer to 12h representation
        function formatHour24(h) {
            if (h < 12) return `${h}:00 AM`;
            if (h === 12) return `12:00 PM`;
            return `${h - 12}:00 PM`;
        }

        // Helper: Parse SQLite UTC timestamp and format into local readable format
        function formatTimestamp(tsStr) {
            if (!tsStr) return 'N/A';
            const parts = tsStr.match(/(\d+)-(\d+)-(\d+) (\d+):(\d+):(\d+)/);
            if (!parts) return tsStr;
            const utcDate = new Date(Date.UTC(
                parseInt(parts[1]),
                parseInt(parts[2]) - 1,
                parseInt(parts[3]),
                parseInt(parts[4]),
                parseInt(parts[5]),
                parseInt(parts[6])
            ));
            return new Intl.DateTimeFormat('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            }).format(utcDate);
        }

        // Helper: Shorter format for compact table cells and lists
        function formatTimestampShort(tsStr) {
            if (!tsStr) return '';
            const parts = tsStr.match(/(\d+)-(\d+)-(\d+) (\d+):(\d+):(\d+)/);
            if (!parts) return '';
            const utcDate = new Date(Date.UTC(
                parseInt(parts[1]),
                parseInt(parts[2]) - 1,
                parseInt(parts[3]),
                parseInt(parts[4]),
                parseInt(parts[5]),
                parseInt(parts[6])
            ));
            return new Intl.DateTimeFormat('en-US', {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            }).format(utcDate);
        }
    </script>
